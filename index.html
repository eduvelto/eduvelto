    <!-- Google AdSense ownership verification (22 Nov 2026) — the meta
         tag stays: it is what links this site to the AdSense account.
         The AdSense library itself is NOT loaded here: it loads only
         through the gated loader in src/components/AdSlot.tsx, which
         runs only when a slot's state is 'ad' — i.e. the master switch
         (ADS_MASTER_ENABLED, lib/adsConfig.ts) is ON and real AdSense
         IDs are configured. A static <script> tag here would load the
         library on every page and, with Auto ads ON in the AdSense
         account, could serve ads the moment Google approves the site —
         bypassing the master flag entirely. Never re-add it. (Verified
         23 Nov 2026 on the /ai-assistant preview: a static tag
         auto-created an ad slot even on no-ads pages — a hidden <ins>
         + 4 ad requests with no AdSlot mounted.) -->
    <meta name="google-adsense-account" content="ca-pub-6571267788512484" />

  <body>
    <div id="root">
      <!-- First-paint loader (app audit, 24 Nov 2026): before the JS
           bundle loads, the page was blank white (notably on slow 3G).
           This static block paints immediately; React replaces it on
           boot. Pure HTML + inline style — no script, so the CSP hash in
           firebase.json is unaffected. -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A1F44;color:#F4F1E9;font-family:system-ui,sans-serif;text-align:center;padding:24px">
        <div style="font-size:28px;font-weight:800;color:#fff">Eduvelto</div>
        <div style="color:#D9A441;font-size:13px;letter-spacing:2px;margin:6px 0 20px">শেখো, এগিয়ে যাও, স্বপ্ন গড়ো</div>
        <div style="font-size:16px">লোড হচ্ছে…</div>
      </div>
    </div>
    <script>
      /* Dark mode: set data-theme before React loads so the first paint
         already uses the saved (or OS) theme — no white flash. Mirrors
         src/lib/theme.tsx (localStorage key 'eduvelto-theme').
         CSP NOTE: this inline script is allowed ONLY by its SHA-256
         hash in firebase.json script-src. If you edit even one byte
         of this script (including this comment), recompute the hash
         and update firebase.json, or the script will be blocked. */
      try {
        var t = localStorage.getItem('eduvelto-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0f1b24' : '#142b3b');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
